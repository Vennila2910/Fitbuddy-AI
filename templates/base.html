<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>


<header class="navbar">

    <a
        href="/"
        class="logo"
    >
        FitBuddy
    </a>


    <a
        href="/"
        class="nav-home"
    >
        Home
    </a>

    <a
        href="/view-all-users?key=fitbuddy-admin"
        class="nav-home"
    >
        View All Users
    </a>

</header>


<main class="container">

    {% block content %}

    {% endblock %}

</main>


<footer>

    FitBuddy — AI Fitness Plan Generator

</footer>


</body>

</html>
